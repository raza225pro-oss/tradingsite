            </div>
        </div>
        <div class="splash-title"><span class="splash-title-line">TRADING</span><span class="splash-title-line">PRO HUB</span></div>
        <div class="splash-bar-container">
            <div class="splash-bar" id="splash-bar"></div>
        </div>
        <div class="splash-percent" id="splash-percent">0%</div>
        <div class="splash-status" id="splash-status">AUTHENTICATING DATABASE...</div>
    </div>

    <!-- PUBLIC ACCESS / KEY LOGIN -->
    <div id="view-access" class="hidden"></div>

    <!-- FORCE JOIN -->
    <div id="view-forcejoin" class="hidden"></div>

    <!-- MAIN DASHBOARD -->
    <div id="view-main" class="hidden">
        <div class="dash-header">
            <div>
                <div class="dash-brand">Trading Pro Hub</div>
                <div class="dash-user" id="dash-user">Public Guest</div>
            </div>
            <div class="dash-secure"><i class="fa-solid fa-shield-halved"></i> Live</div>
        </div>
        <div class="dash-search">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search..." oninput="App.filterItems(this.value)">
            </div>
        </div>
        <div class="dash-content" id="dash-content"></div>
        <div class="bottom-nav">
            <div class="nav-item active" onclick="App.switchTab('tools',this)"><i class="fa-solid fa-chart-line"></i>Tools</div>
            <div class="nav-item" onclick="App.switchTab('apks',this)"><i class="fa-solid fa-bolt"></i>Signals</div>
            <div class="nav-item" onclick="App.switchTab('courses',this)"><i class="fa-solid fa-graduation-cap"></i>Academy</div>
            <div class="nav-item" onclick="App.switchTab('profile',this)"><i class="fa-solid fa-user"></i>Profile</div>
            <div class="nav-item" onclick="App.switchTab('premium',this)"><i class="fa-solid fa-crown"></i>VIP</div>
        </div>
    </div>
</div>

<script>
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

const App = {
    state: { admin:{}, keys:[], tools:[], links:[], courses:[], premiumConfig:{}, premiumContent:[], premiumKeys:[] },
    currentTab: 'tools',
    sessionKey: 'rv_session',
    fjSessionKey: 'rv_fj_verified',
    premiumSessionKey: 'rv_premium_access',

    persist() {
        return SB.save(this.state).catch(() => {});
    },

    init() {
        document.getElementById('dash-content').addEventListener('click', (e) => {
            const link = e.target.closest('[data-link-url]');
            if (link) { window.open(link.dataset.linkUrl, '_blank'); return; }
            const course = e.target.closest('[data-course-url]');
            if (course) { window.open(course.dataset.courseUrl, '_blank'); return; }
            const tool = e.target.closest('[data-tool-id]');
            if (tool) { this.openTool(tool.dataset.toolId); return; }
        });
        const cachedLogo = localStorage.getItem('rv_logo_cache');
        if (cachedLogo) {
            const customLogo = document.getElementById('custom-logo');
            customLogo.src = cachedLogo;
            customLogo.style.display = 'block';
        }
        this.runSplash();
    },

    toast(msg, type='success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        const icon = type === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
        t.innerHTML = icon + '<span>' + msg + '</span>';
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    },

    runSplash() {
        const bar = document.getElementById('splash-bar');
        const status = document.getElementById('splash-status');
        const percent = document.getElementById('splash-percent');
        const msgs = ['CONNECTING TO MARKETS...', 'LOADING TRADING MODULES...', 'VERIFYING ACCESS...', 'INITIALIZING HUB...'];
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 25 + 10;
            if (progress > 100) progress = 100;
            const displayProgress = Math.round(progress);
            bar.style.width = displayProgress + '%';
            percent.textContent = displayProgress + '%';
            status.textContent = msgs[Math.min(Math.floor(progress / 25), msgs.length - 1)];
            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => this.connectFirebase(), 200);
            }
        }, 150);
    },

    async connectFirebase() {
        try {
            let data = await SB.load();
            if (!data || !data.admin) {
                document.getElementById('splash-status').textContent = 'CONFIGURING DATABASE...';
                const defaults = {
                    admin: { user:'admin', pass:'admin', waLink:'', keySystemActive:true, forceJoin:{ active:true, telegram:'', whatsapp:'', note:'Join our official channel to unlock the tools and get latest updates!' } },
                    keys: [{ id:'k_master', key:'darkmasterub', name:'Master Access', limit:0, uses:0, expiry:'', active:true, tools:['all'] }],
                    tools: [], links: [], courses: [], premiumConfig:{}, premiumContent:[], premiumKeys:[]
                };
                await SB.save(defaults);
                data = await SB.load();
            }
            this.onDataReady(data || {});
        } catch (err) {
            document.getElementById('splash-status').textContent = 'CONNECTION FAILED. RETRYING...';
            setTimeout(() => this.connectFirebase(), 2000);
        }
    },

    onDataReady(data) {
        this.state.admin = data.admin || {};
        this.state.keys = data.keys || [];
        this.state.tools = data.tools || [];
        this.state.links = data.links || [];
        this.state.courses = data.courses || [];
        this.state.premiumConfig = data.premiumConfig || {};
        this.state.premiumContent = data.premiumContent || [];
        this.state.premiumKeys = data.premiumKeys || [];
        if (!this.state.admin.forceJoin) this.state.admin.forceJoin = { active:true, telegram:'', whatsapp:'', note:'' };

        // Force-enable forceJoin if no links configured yet (admin hasn't explicitly configured it)
        const fj = this.state.admin.forceJoin;
        const hasLinks = (fj.telegram && fj.telegram.trim()) || (fj.whatsapp && fj.whatsapp.trim());
        if (fj.active === false && !hasLinks) {
            fj.active = true;
            this.persist();
        }

        // Set custom logo
        const logo = this.state.admin.logo;
        const customLogo = document.getElementById('custom-logo');
        if(logo){
            customLogo.src=logo;
            customLogo.style.display='block';
            try{localStorage.setItem('rv_logo_cache',logo);}catch(e){}
        } else {
            customLogo.style.display='none';
            try{localStorage.removeItem('rv_logo_cache');}catch(e){}
        }

        setTimeout(() => {
            document.getElementById('splash').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                this.handleRouting();
            }, 400);
        }, 300);
    },

    handleRouting() {
        if (sessionStorage.getItem(this.sessionKey)) {
            if (this.state.admin.forceJoin && this.state.admin.forceJoin.active && !sessionStorage.getItem(this.fjSessionKey)) {
                this.showForceJoin();
                return;
            }
            this.showMain();
            return;
        }
        this.showAccessScreen();
    },

    showAccessScreen() {
        const el = document.getElementById('view-access');
        el.classList.remove('hidden');
        let waHtml = '';
        if (this.state.admin.waLink) {
            const waUrl = this.state.admin.waLink;
            if (waUrl.startsWith('http://') || waUrl.startsWith('https://') || waUrl.startsWith('whatsapp://')) {
                waHtml = '<a href="'+h(waUrl)+'" target="_blank" style="display:block;margin-top:15px;color:var(--green);font-size:13px;text-decoration:none;"><i class="fa-brands fa-whatsapp"></i> Contact for Access</a>';
            }
        }
        const keyActive = this.state.admin.keySystemActive !== false;
        el.innerHTML = `
            <div class="access-card" style="border-color:var(--cyan);">
                <div class="access-icon cyan"><i class="fa-solid fa-chart-line"></i></div>
                <div class="access-title gradient-text">TRADING ACCESS</div>
                <div class="access-sub">${keyActive ? 'Enter passkey or continue as guest.' : 'Key system disabled. Continue as guest.'}</div>
                ${keyActive ? `
                <form onsubmit="App.keyLogin(event)" style="width:100%;">
                    <input type="text" id="key-input" placeholder="Enter Passkey" autocapitalize="off" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:#fff;padding:14px 16px;border-radius:12px;font-size:15px;margin-bottom:14px;font-family:var(--font-body);outline:none;text-align:center;">
                    <button type="submit" class="btn-guest" style="background:linear-gradient(135deg, var(--cyan), var(--green));">UNLOCK WITH KEY</button>
                </form>
                <div style="margin:18px 0 8px;padding:12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px dashed var(--card-border);text-align:center;">
                    <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">OR</span>
                </div>
                ` : ''}
                <button class="btn-guest" onclick="App.continueAsGuest()" style="background:linear-gradient(135deg, var(--green), var(--gold));"><i class="fa-solid fa-user"></i> CONTINUE AS GUEST</button>
                ${waHtml}
                <div class="developed-by">DEVELOPED BY TRADING PRO HUB</div>
            </div>
        `;
    },

    keyLogin(e) {
        e.preventDefault();
        const inputKey = document.getElementById('key-input').value.trim();
        const keyData = this.state.keys.find(k => k.key === inputKey && k.active);
        if (!keyData) { this.toast('Invalid or inactive passkey', 'error'); return; }
        if (keyData.expiry && new Date(keyData.expiry) < new Date()) { this.toast('This passkey has expired', 'error'); return; }

        // Usage counter
        const keyIndex = this.state.keys.findIndex(k => k.id === keyData.id);
        const currentUses = keyData.uses || 0;
        const newCount = currentUses + 1;
        if (keyData.limit > 0 && newCount > keyData.limit) {
            this.toast('Passkey usage limit reached', 'error');
            return;
        }
        this.state.keys[keyIndex].uses = newCount;
        this.persist();
        keyData.uses = newCount;
        sessionStorage.setItem(this.sessionKey, JSON.stringify({ key: inputKey, name: keyData.name, type: 'key', _t: Date.now() }));
        this.showMain();
    },

    continueAsGuest() {
        if (this.state.admin.forceJoin && this.state.admin.forceJoin.active && !sessionStorage.getItem(this.fjSessionKey)) {
            this.showForceJoin();
        } else {
            sessionStorage.setItem(this.sessionKey, JSON.stringify({ key: 'GUEST_MODE', name: 'Public Guest', type: 'guest', _t: Date.now() }));
            this.showMain();
        }
    },

    showForceJoin() {
        document.getElementById('view-access').classList.add('hidden');
        document.getElementById('view-main').classList.add('hidden');
        const el = document.getElementById('view-forcejoin');
        el.classList.remove('hidden');
        const fj = this.state.admin.forceJoin || { active:true, telegram:'', whatsapp:'', note:'' };
        const note = h(fj.note || 'Join our official channel to unlock the tools and get latest updates!');
        const hasTg = fj.telegram && fj.telegram.trim().length > 0;
        const hasWa = fj.whatsapp && fj.whatsapp.trim().length > 0;

        let tgBtn = '', waBtn = '';
        if (hasTg) {
            tgBtn = '<a href="'+h(fj.telegram)+'" target="_blank" class="btn-telegram" id="btn-tg" onclick="App.markTgClicked()"><i class="fa-brands fa-telegram"></i> Join Telegram</a>';
        }
        if (hasWa) {
            waBtn = '<a href="'+h(fj.whatsapp)+'" target="_blank" class="btn-whatsapp" id="btn-wa" onclick="App.markWaClicked()"><i class="fa-brands fa-whatsapp"></i> Join WhatsApp</a>';
        }

        let verifyBtn = '';
        if (hasTg || hasWa) {
            verifyBtn = '<button class="btn-verify" id="btn-verify-status" onclick="App.verifyForceJoin()">Verify Join Status</button>';
        } else {
            verifyBtn = '<button class="btn-verify" disabled style="opacity:0.5;cursor:not-allowed;">No Links Configured - Contact Admin</button>';
        }

        el.innerHTML = `
            <div style="display:flex;justify-content:center;align-items:center;height:100%;width:100%;padding:20px;box-sizing:border-box;">
                <div style="background:#0d1712;border:2px solid #ff3b4e;border-radius:20px;padding:40px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 30px rgba(255,59,78,0.2);">
                    <div style="font-size:3rem;color:#ff3b4e;margin-bottom:15px;"><i class="fa-solid fa-lock"></i></div>
                    <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:2px;">VERIFICATION REQUIRED</div>
                    <div style="color:#8aa395;font-size:13px;margin-bottom:25px;line-height:1.6;">${note}</div>
                    ${tgBtn}
                    ${waBtn}
                    ${verifyBtn}
                </div>
            </div>
        `;
    },

    tgClicked: false,
    waClicked: false,

    markTgClicked() { this.tgClicked = true; },
    markWaClicked() { this.waClicked = true; },

    verifyForceJoin() {
        const fj = this.state.admin.forceJoin;
        const hasTg = fj.telegram && fj.telegram.trim().length > 0;
        const hasWa = fj.whatsapp && fj.whatsapp.trim().length > 0;

        // If no links configured - block access, show contact admin
        if (!hasTg && !hasWa) {
            this.toast('Force Join not configured. Contact admin.', 'error');
            return;
        }
        // Need to click ALL configured links
        if ((hasTg && !this.tgClicked) || (hasWa && !this.waClicked)) {
            this.toast('Please click all channel links first', 'error');
            return;
        }
        this.showForceJoinVerified();
    },

    showForceJoinVerified() {
        const el = document.getElementById('view-forcejoin');
        const fj = this.state.admin.forceJoin;
        const note = h(fj.note || 'Join our official channel to unlock the tools and get latest updates!');
        const hasTg = fj.telegram && fj.telegram.trim().length > 0;
        const hasWa = fj.whatsapp && fj.whatsapp.trim().length > 0;

        let tgBtn = '', waBtn = '';
        if (hasTg) {
            tgBtn = '<div class="btn-telegram verified"><i class="fa-solid fa-circle-check"></i> Verified</div>';
        }
        if (hasWa) {
            waBtn = '<div class="btn-whatsapp verified"><i class="fa-solid fa-circle-check"></i> Verified</div>';
        }

        el.innerHTML = `
            <div style="display:flex;justify-content:center;align-items:center;height:100%;width:100%;padding:20px;box-sizing:border-box;">
                <div style="background:#0d1712;border:2px solid #ff3b4e;border-radius:20px;padding:40px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 30px rgba(255,59,78,0.2);">
                    <div style="font-size:3rem;color:#ff3b4e;margin-bottom:15px;"><i class="fa-solid fa-lock"></i></div>
                    <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:#fff;margin-bottom:8px;letter-spacing:2px;">VERIFICATION REQUIRED</div>
                    <div style="color:#8aa395;font-size:13px;margin-bottom:25px;line-height:1.6;">${note}</div>
                    ${tgBtn}
                    ${waBtn}
                    <button onclick="App.enterVault()" style="width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer;color:#000;background:#00e676;margin-top:8px;">Enter Trading Hub</button>
                </div>
            </div>
        `;
    },

    enterVault() {
        sessionStorage.setItem(this.fjSessionKey, 'true');
        sessionStorage.setItem(this.sessionKey, JSON.stringify({ key: 'GUEST_MODE', name: 'Public Guest', type: 'guest', _t: Date.now() }));
        this.showMain();
    },

    showMain() {
        let session;
        try { session = JSON.parse(sessionStorage.getItem(this.sessionKey) || '{}'); } catch(e) { session = {}; }
        // Validate session format (prevents console injection)
        if (!session.type || !session._t || Date.now() - session._t > 86400000) {
            sessionStorage.removeItem(this.sessionKey);
            sessionStorage.removeItem(this.fjSessionKey);
            this.handleRouting();
            return;
        }
        // Defense: if guest and force join active but not verified, redirect to force join
        if (session.type !== 'key' && this.state.admin.forceJoin && this.state.admin.forceJoin.active && !sessionStorage.getItem(this.fjSessionKey)) {
            this.showForceJoin();
            return;
        }
        document.getElementById('view-access').classList.add('hidden');
        document.getElementById('view-forcejoin').classList.add('hidden');
        const main = document.getElementById('view-main');
        main.classList.remove('hidden');

        document.getElementById('dash-user').textContent = session.name || 'Public Guest';

        this.switchTab('tools');
    },

    switchTab(tab, el) {
        this.currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if (el) el.classList.add('active');
        document.getElementById('search-input').value = '';
        this.renderContent();
    },

    filterItems(query) {
        this.renderContent(query.toLowerCase());
    },

    renderContent(query='') {
        const content = document.getElementById('dash-content');
        const session = JSON.parse(sessionStorage.getItem(this.sessionKey) || '{}');

        if (this.currentTab === 'tools') {
            let tools = this.state.tools.filter(t => t.active);
            if (query) tools = tools.filter(t => t.name.toLowerCase().includes(query));

            if (!tools.length) {
                content.innerHTML = '<div class="section-title">TRADING TOOLS</div><div class="empty-state"><i class="fa-solid fa-chart-line"></i><span>No trading tools assigned.</span></div>';
            } else {
                content.innerHTML = '<div class="section-title">TRADING TOOLS</div>' + tools.map(t => {
                    const icon = t.iconType === 'img' && t.iconData ? '<img src="'+h(t.iconData)+'" style="width:100%;height:100%;object-fit:cover;">' : '<i class="'+h(t.icon||'fa-solid fa-cube')+'" style="color:var(--cyan);"></i>';
                    return '<div class="list-item-card" data-tool-id="'+h(t.id)+'" style="background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;"><div style="width:44px;height:44px;border-radius:12px;background:rgba(0,240,255,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+icon+'</div><div style="flex:1;"><div style="font-weight:600;font-size:14px;">'+h(t.name)+'</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">HTML Tool</div></div><i class="fa-solid fa-chevron-right" style="color:var(--text-muted);font-size:12px;"></i></div>';
                }).join('');
            }
        } else if (this.currentTab === 'apks') {
            let links = this.state.links.filter(l => l.active);
            if (query) links = links.filter(l => l.name.toLowerCase().includes(query));

            if (!links.length) {
                content.innerHTML = '<div class="section-title">APPS & SIGNALS</div><div class="empty-state"><i class="fa-solid fa-bolt"></i><span>No apps or signals assigned.</span></div>';
            } else {
                content.innerHTML = '<div class="section-title">APPS & SIGNALS</div><div class="apk-grid">' + links.map(l => {
                    const icon = l.iconType === 'img' && l.iconData ? '<img src="'+h(l.iconData)+'">' : '<i class="'+h(l.icon||'fa-brands fa-android')+'" style="color:var(--gold);"></i>';
                    return '<div class="apk-card" data-link-url="'+h(l.url)+'"><div class="apk-badge">APK/APP</div><div class="apk-icon">'+icon+'</div><div class="apk-name">'+h(l.name)+'</div></div>';
                }).join('') + '</div>';
            }
        } else if (this.currentTab === 'courses') {
            let courses = this.state.courses.filter(c => c.active);
            if (query) courses = courses.filter(c => c.name.toLowerCase().includes(query));

            if (!courses.length) {
                content.innerHTML = '<div class="section-title">TRADING ACADEMY</div><div class="empty-state"><i class="fa-solid fa-graduation-cap"></i><span>No courses available yet.</span></div>';
            } else {
                content.innerHTML = '<div class="section-title">TRADING ACADEMY</div>' + courses.map(c => {
                    const poster = c.posterData ? '<img src="'+h(c.posterData)+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">' : '<i class="fa-solid fa-graduation-cap" style="color:var(--cyan);font-size:1.2rem;"></i>';
                    const desc = c.description ? (c.description.length>50?c.description.substring(0,50)+'...':c.description) : '';
                    return '<div class="list-item-card" data-course-url="'+h(c.url)+'" style="background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;"><div style="width:56px;height:40px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+poster+'</div><div style="flex:1;"><div style="font-weight:600;font-size:14px;">'+h(c.name)+'</div>'+(desc?'<div style="font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+h(desc)+'</div>':'')+'<div style="font-size:11px;color:var(--text-muted);margin-top:3px;">'+h((c.format||'Course').toUpperCase())+'</div></div><i class="fa-solid fa-chevron-right" style="color:var(--text-muted);font-size:12px;"></i></div>';
                }).join('');
            }
        } else if (this.currentTab === 'profile') {
            const session = JSON.parse(sessionStorage.getItem(this.sessionKey) || '{}');
            const keyName = h(session.key || 'GUEST_MODE');
            const userName = h(session.name || 'Public Guest');

            content.innerHTML = `
                <div class="profile-section">
                    <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="profile-name">${userName}</div>
                    <div class="profile-badge">ACTIVE SESSION</div>
                </div>
                <div class="hash-card">
                    <div class="hash-title"><i class="fa-solid fa-chart-line"></i> ACCOUNT HASH</div>
                    <div class="hash-row"><span class="hash-label">Key Signature</span><span class="hash-value">${keyName}</span></div>
                    <div class="hash-row"><span class="hash-label">Usage Counter</span><span class="hash-value">&infin;</span></div>
                    <div class="hash-row"><span class="hash-label">Expiration Date</span><span class="hash-value">Never</span></div>
                </div>
                <button class="btn-terminate" onclick="App.terminateSession()"><i class="fa-solid fa-power-off"></i> Terminate Session Securely</button>
            `;
        } else if (this.currentTab === 'premium') {
            this.renderPremiumContent();
        }
    },

    renderPremiumContent() {
        const content = document.getElementById('dash-content');
        const premiumData = JSON.parse(sessionStorage.getItem(this.premiumSessionKey) || 'null');
        const isGranted = premiumData && premiumData.access === true;

        if (isGranted) {
            // Show premium content
            const items = this.state.premiumContent.filter(c => c.active);
            if (!items.length) {
                content.innerHTML = '<div class="section-title">VIP SIGNALS</div><div class="empty-state"><i class="fa-solid fa-crown" style="color:var(--gold);"></i><span>No VIP content available yet.</span></div>';
            } else {
                content.innerHTML = '<div class="section-title">VIP SIGNALS</div>' + items.map(c => {
                    const typeMap = { course:'fa-solid fa-graduation-cap', apk:'fa-brands fa-android', video:'fa-solid fa-video', image:'fa-solid fa-image', zip:'fa-solid fa-file-zipper' };
                    const iconHtml = c.iconType === 'img' && c.iconData ? '<img src="'+h(c.iconData)+'" style="width:100%;height:100%;object-fit:cover;">' : '<i class="'+h(c.icon||typeMap[c.type]||'fa-solid fa-cube')+'" style="color:var(--gold);"></i>';
                    const typeLabels = { course:'Course', apk:'APK', video:'Video', image:'Image', zip:'ZIP Archive' };
                    return '<div class="list-item-card" onclick="window.open(\''+h(c.url)+'\',\'_blank\')" style="background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 0 15px rgba(255,215,64,0.08);"><div style="width:44px;height:44px;border-radius:12px;background:rgba(255,215,64,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+iconHtml+'</div><div style="flex:1;"><div style="font-weight:600;font-size:14px;color:var(--gold);">'+h(c.name)+'</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">'+h(typeLabels[c.type]||c.type||'Content')+'</div></div><i class="fa-solid fa-chevron-right" style="color:var(--gold);font-size:12px;"></i></div>';
                }).join('');
            }
        } else {
            // Show auth screen: payment OR key
            const cfg = this.state.premiumConfig;
            const bankName = h(cfg.bankName||'EasyPaisa');
            const account = h(cfg.accountNumber||'03238693440');
            const receiver = h(cfg.receiverName||'Receiver');
            const amount = cfg.amount||500;
            const adminWA = h(cfg.adminWhatsApp || '923238693440');

            content.innerHTML = `
                <div class="section-title">PREMIUM ACCESS REQUIRED</div>
                <div style="background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:24px 20px;text-align:center;margin-bottom:20px;box-shadow:0 0 30px rgba(255,215,64,0.1);">
                    <i class="fa-solid fa-crown" style="font-size:3rem;color:var(--gold);margin-bottom:12px;"></i>
                    <div style="font-family:var(--font);font-size:18px;font-weight:700;color:var(--gold);margin-bottom:6px;">Unlock Premium</div>
                    <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">Get access to exclusive premium content</div>
                </div>

                <!-- Payment Option -->
                <div style="background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-bottom:16px;">
                    <div style="font-weight:700;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-building-columns" style="color:var(--green);"></i> Pay &amp; Get Premium Key</div>
                    <div style="background:rgba(255,215,64,0.08);border:1px solid rgba(255,215,64,0.2);border-radius:10px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.7;">
                        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:var(--text-muted);">Bank:</span><span style="font-weight:600;">${bankName}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:var(--text-muted);">Account:</span><span style="font-weight:600;font-family:monospace;">${account}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:4px 0;"><span style="color:var(--text-muted);">Receiver:</span><span style="font-weight:600;">${receiver}</span></div>
                        <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid rgba(255,215,64,0.15);margin-top:6px;padding-top:8px;"><span style="color:var(--text-muted);">Amount:</span><span style="font-weight:700;color:var(--gold);font-size:16px;">Rs ${amount}</span></div>
                    </div>
                    <div style="background:rgba(37,211,102,0.08);border:1px solid rgba(37,211,102,0.2);border-radius:10px;padding:14px;text-align:center;">
                        <div style="margin-bottom:8px;color:var(--text-muted);font-size:13px;">After payment, send screenshot on this number:</div>
                        <div style="font-size:18px;font-weight:700;color:#25D366;margin-bottom:10px;">${adminWA}</div>
                        <a href="https://wa.me/${adminWA}" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;"><i class="fa-brands fa-whatsapp" style="font-size:18px;"></i> Send Screenshot on WhatsApp</a>
                    </div>
                </div>

                <!-- Divider -->
                <div style="display:flex;align-items:center;gap:14px;margin:12px 0 18px;">
                    <div style="flex:1;height:1px;background:var(--card-border);"></div>
                    <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--font);">OR</span>
                    <div style="flex:1;height:1px;background:var(--card-border);"></div>
                </div>

                <!-- Premium Key Option -->
                <div style="background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:20px;margin-bottom:16px;">
                    <div style="font-weight:700;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-key" style="color:var(--cyan);"></i> Already Have a Premium Key?</div>
                    <form onsubmit="App.submitPremiumKey(event)" style="width:100%;">
                        <input type="text" id="premium-key-input" placeholder="Enter Premium Key" required style="width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;margin-bottom:12px;font-family:var(--font-body);outline:none;text-align:center;">
                        <button type="submit" class="btn-guest" style="background:linear-gradient(135deg, var(--cyan), var(--green));"><i class="fa-solid fa-unlock-keyhole"></i> Unlock Premium</button>
                    </form>
                </div>
                <div style="height:30px;"></div>
            `;
        }
    },

    submitPremiumKey(e) {
        e.preventDefault();
        const keyStr = document.getElementById('premium-key-input').value.trim();
        if (!keyStr) { this.toast('Enter a premium key','error'); return; }
        const keyData = this.state.premiumKeys.find(k => k.key === keyStr && k.active);
        if (!keyData) { this.toast('Invalid or inactive premium key','error'); return; }
        if (keyData.expiry && new Date(keyData.expiry) < new Date()) { this.toast('This premium key has expired','error'); return; }
        const keyIndex = this.state.premiumKeys.findIndex(k => k.id === keyData.id);
        const newCount = (keyData.uses || 0) + 1;
        if (keyData.limit > 0 && newCount > keyData.limit) {
            this.toast('Premium key usage limit reached','error');
            return;
        }
        this.state.premiumKeys[keyIndex].uses = newCount;
        this.persist();
        keyData.uses = newCount;
        sessionStorage.setItem(this.premiumSessionKey, JSON.stringify({ access: true, method: 'key', key: keyStr }));
        this.toast('Premium unlocked with key!');
        this.renderPremiumContent();
    },

    openTool(id) {
        const tool = this.state.tools.find(t => t.id === id);
        if (!tool) return;
        const viewer = window.open('', '_blank');
        viewer.document.write(tool.html || '<h1>No content</h1>');
        viewer.document.close();
    },

    terminateSession() {
        sessionStorage.removeItem(this.sessionKey);
        sessionStorage.removeItem(this.fjSessionKey);
        sessionStorage.removeItem(this.premiumSessionKey);
        this.tgClicked = false;
        this.waClicked = false;
        document.getElementById('view-main').classList.add('hidden');
        document.getElementById('view-access').classList.add('hidden');
        document.getElementById('view-forcejoin').classList.add('hidden');
        this.handleRouting();
        this.toast('Session terminated');
    }
};

App.init();
</script>
</body>
</html>
